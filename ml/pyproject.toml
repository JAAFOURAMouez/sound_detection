[project]
name = "soundguard-ml"
version = "0.0.0"
description = "Entraînement, évaluation et export ONNX des modèles SoundGuard"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
# Installé à partir de la phase 3 : uv sync --extra train
train = []

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundguard_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY"]

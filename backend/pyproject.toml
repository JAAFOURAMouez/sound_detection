[project]
name = "soundguard-backend"
version = "0.0.0"
description = "API légère de dialogue pour SoundGuard (métadonnées d'événements uniquement)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pydantic-settings==2.16.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Avertissement interne à Starlette sur son client de test, sans effet sur le code applicatif.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
